name: AirBridge Windows EXE Build (M2.4 acceptance)

on:
  push:
    branches:
      - feature/m2-4-zero-touch-agent-auth
    paths:
      - "AirBridge.spec"
      - "airbridge_app.py"
      - "protocol.py"
      - "eda_engine.py"
      - "fs_engine.py"
      - "shell_engine.py"
      - "capture_tcl_bridge.py"
      - "runtime_adapter.py"
      - "runtime_session_protocol.py"
      - "request_tracker.py"
      - "request_broker.py"
      - "process_supervisor.py"
      - "agent_security.py"
      - ".github/workflows/build-airbridge-exe-m2-4.yml"

permissions:
  contents: read

jobs:
  build-windows-exe:
    name: Build AirBridge.exe for M2.4 acceptance (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"

      - name: Install EXE build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install pyserial PySide6 pyinstaller
          python --version
          python -m pip show pyserial PySide6 pyinstaller

      - name: Compile AirBridge modules
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m py_compile airbridge_app.py protocol.py eda_engine.py fs_engine.py shell_engine.py capture_tcl_bridge.py runtime_adapter.py runtime_session_protocol.py request_tracker.py request_broker.py process_supervisor.py agent_security.py

      - name: Build single-file AirBridge.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m PyInstaller --version
          python -m PyInstaller --clean --noconfirm AirBridge.spec
          $exe = "dist/AirBridge.exe"
          if (-not (Test-Path $exe -PathType Leaf)) {
            throw "PyInstaller did not produce dist/AirBridge.exe"
          }
          $file = Get-Item $exe
          if ($file.Length -lt 1MB) {
            throw "AirBridge.exe is unexpectedly small ($($file.Length) bytes)"
          }
          $sha256 = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "artifact=AirBridge.exe"
            "source_commit=${{ github.sha }}"
            "python_version=$((python --version) -join ' ')"
            "pyinstaller_version=$((python -m PyInstaller --version) -join ' ')"
            "sha256=$sha256"
            "size_bytes=$($file.Length)"
            "platform=Windows x64"
          ) | Set-Content -Path "dist/BUILD_INFO.txt" -Encoding utf8
          Get-Content "dist/BUILD_INFO.txt"

      - name: Upload AirBridge.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirBridge-M2.4-Windows-x64-${{ github.sha }}
          path: |
            dist/AirBridge.exe
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
