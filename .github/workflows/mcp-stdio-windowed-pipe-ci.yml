name: MCP STDIO windowed EXE pipe compatibility

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/stdio_windowed_pipe_probe_child.py"
      - ".github/scripts/run_stdio_windowed_pipe_probe.py"
      - ".github/workflows/mcp-stdio-windowed-pipe-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-stdio-windowed-pipe-\${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windowed-exe-stdio-pipes:
    name: Frozen windowed EXE inherited stdin/stdout/stderr pipes (Windows)
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.9,<7"
          python --version
          python -m PyInstaller --version

      - name: Build a one-file windowed executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $env:RUNNER_TEMP "stdio-probe-dist"
          $work = Join-Path $env:RUNNER_TEMP "stdio-probe-work"
          python -m PyInstaller --clean --noconfirm --onefile --windowed --noupx --name AirBridgeStdioPipeProbe --distpath $dist --workpath $work ".github/scripts/stdio_windowed_pipe_probe_child.py"
          $exe = Join-Path $dist "AirBridgeStdioPipeProbe.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "PyInstaller did not produce the windowed probe EXE."
          }
          Get-Item $exe | Select-Object FullName, Length

      - name: Verify inherited standard handles and clean protocol stdout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $env:RUNNER_TEMP "stdio-probe-dist/AirBridgeStdioPipeProbe.exe"
          python ".github/scripts/run_stdio_windowed_pipe_probe.py" --exe $exe

