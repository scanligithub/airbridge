name: Capture Process Inventory CI

on:
  push:
    branches:
      - main
      - feature/m3-2-2-capture-process-inventory
      - feature/m3-2-3-capture-controlled-startup
      - feature/m3-2-4-capture-tcl-request-queue
      - feature/m3-2-5-capture-design-open-dbo-readonly
      - feature/m3-2-6-capture-authorized-exit
    paths:
      - "skill/orcad-capture/**"
      - "test/test_orcad_capture_*.py"
      - "doc/README.md"
      - ".github/workflows/capture-process-ci.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - feature/m3-2-2-capture-process-inventory
      - feature/m3-2-3-capture-controlled-startup
      - feature/m3-2-4-capture-tcl-request-queue
      - feature/m3-2-5-capture-design-open-dbo-readonly
      - feature/m3-2-6-capture-authorized-exit
    paths:
      - "skill/orcad-capture/**"
      - "test/test_orcad_capture_*.py"
      - "doc/README.md"
      - ".github/workflows/capture-process-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-process-inventory:
    name: Capture process inventory (Python ${{ matrix.python-version }})
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Capture Skill modules
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          python -m py_compile skill/orcad-capture/scripts/airbridge_client.py skill/orcad-capture/scripts/capture_session.py skill/orcad-capture/scripts/capture_process.py skill/orcad-capture/scripts/capture_startup.py skill/orcad-capture/scripts/capture_requests.py skill/orcad-capture/scripts/capture_design.py skill/orcad-capture/scripts/capture_exit.py

      - name: Run Capture Skill and process inventory unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m unittest discover -s test -p "test_orcad_capture_*.py" -v
