name: G-01 Windows CurrentUser trust-scope and chain CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/g01-currentuser-trust.ps1"
      - ".github/scripts/run-g01-as-standard-user.ps1"
      - ".github/scripts/g01-interactive-currentuser-import.ps1"
      - ".github/workflows/g01-windows-currentuser-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g01-currentuser-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  currentuser-https-trust:
    name: Standard-user store-scope + custom-chain checks (Windows)
    runs-on: windows-2025
    timeout-minutes: 8

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Record runner user context
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          whoami
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          "identity=$($identity.Name)"
          "is_elevated_admin=$($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
          "powershell=$($PSVersionTable.PSVersion)"
          "runner_image=$env:ImageOS"
          "runner_version=$env:ImageVersion"

      - name: Parse interactive G-01B script (do not execute in CI)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $scriptPath = ".github/scripts/g01-interactive-currentuser-import.ps1"
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $scriptPath).Path,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Host
            throw "G-01B PowerShell parser reported errors."
          }
          $source = Get-Content -LiteralPath $scriptPath -Raw
          $imports = @($tokens | Where-Object {
            $_ -is [System.Management.Automation.Language.StringConstantExpressionAst] -and
            $_.Value -eq "Import-Certificate"
          })
          if ($source -notmatch "CertStoreLocation\\s+'Cert:\\\\CurrentUser\\\\Root'") {
            throw "G-01B must target CurrentUser\\Root explicitly."
          }
          if ($source -match "CertStoreLocation\\s+'Cert:\\\\LocalMachine") {
            throw "G-01B must never target LocalMachine certificate stores."
          }
          "G-01B syntax and target-store static checks: PASS (interactive script not executed)."

      - name: Run noninteractive-safe trust-scope and custom-chain checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -NoLogo -NoProfile -NonInteractive -File ".github/scripts/run-g01-as-standard-user.ps1"

      - name: Upload sanitized G-01 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G01-Windows-CurrentUser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g01-standard-user-*/**/*
          if-no-files-found: warn
          retention-days: 14
