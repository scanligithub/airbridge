name: G-01 Windows CurrentUser trust-scope and chain CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/g01-currentuser-trust.ps1"
      - ".github/scripts/run-g01-as-standard-user.ps1"
      - ".github/scripts/g01-interactive-currentuser-import.ps1"
      - ".github/scripts/g01-cryptui-native.ps1"
      - ".github/scripts/g01-cryptui-import-ci.ps1"
      - ".github/workflows/g01-windows-currentuser-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g01-currentuser-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  currentuser-https-trust:
    name: Standard-user store-scope + custom-chain checks (Windows)
    runs-on: windows-2025
    timeout-minutes: 8

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Record runner user context
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          whoami
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          "identity=$($identity.Name)"
          "is_elevated_admin=$($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
          "powershell=$($PSVersionTable.PSVersion)"
          "runner_image=$env:ImageOS"
          "runner_version=$env:ImageVersion"

      - name: Parse and verify CryptUIWizImport scripts (interactive script is not executed)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $paths = @(
            ".github/scripts/g01-cryptui-native.ps1",
            ".github/scripts/g01-interactive-currentuser-import.ps1",
            ".github/scripts/g01-cryptui-import-ci.ps1",
            ".github/scripts/g01-currentuser-trust.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List | Out-String | Write-Host
              throw "PowerShell parser reported errors in $path."
            }
          }

          $native = Get-Content -LiteralPath ".github/scripts/g01-cryptui-native.ps1" -Raw
          $interactive = Get-Content -LiteralPath ".github/scripts/g01-interactive-currentuser-import.ps1" -Raw
          if (-not $native.Contains("CryptUIWizImport") -or -not $native.Contains("CertOpenStore")) {
            throw "Native CryptUI / Crypt32 declarations are missing."
          }
          if (-not $native.Contains("0x00020000") -or -not $native.Contains("0x00010000")) {
            throw "ALLOW_CERT / NO_CHANGE_DEST_STORE flags are missing."
          }
          if (-not $interactive.Contains("Invoke-G01CryptUIWizImport -CertificateFile") -or
              $interactive.Contains("-NoUI")) {
            throw "Production G-01B must call CryptUIWizImport without the NO_UI switch."
          }
          if (-not $interactive.Contains("Open-G01CurrentUserRootStore")) {
            throw "Production G-01B must pin the destination handle to CurrentUser Root."
          }
          "PowerShell syntax, native API declarations, documented flags, and production UI-mode checks: PASS."

      - name: Run noninteractive-safe trust-scope and custom-chain checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -NoLogo -NoProfile -NonInteractive -File ".github/scripts/run-g01-as-standard-user.ps1"

      - name: Upload sanitized G-01 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G01-Windows-CurrentUser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g01-standard-user-*/**/*
          if-no-files-found: warn
          retention-days: 14
