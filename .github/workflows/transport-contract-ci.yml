name: Transport Contract MVP CI

on:
  pull_request:
    branches: [main]
    paths:
      - "skill/transport/**"
      - "test/test_transport_provider.py"
      - "test/test_airbridge_provider.py"
      - "scripts/airbridge_live_acceptance.py"
      - ".github/workflows/transport-contract-ci.yml"
  push:
    branches: [main]
    paths:
      - "skill/transport/**"
      - "test/test_transport_provider.py"
      - "test/test_airbridge_provider.py"
      - "scripts/airbridge_live_acceptance.py"
      - ".github/workflows/transport-contract-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport-contract:
    name: Transport Providers (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Transport modules
        run: python -m py_compile skill/transport/contract.py skill/transport/fake_provider.py skill/transport/airbridge_provider.py scripts/airbridge_live_acceptance.py
      - name: Run Transport Provider tests
        run: |
          python -m unittest discover -s test -p "test_transport_provider.py" -v
          python -m unittest discover -s test -p "test_airbridge_provider.py" -v
