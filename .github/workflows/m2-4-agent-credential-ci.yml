name: M2.4 Agent Credential Provider CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "mcp_gateway/**"
      - ".github/workflows/m2-4-agent-credential-ci.yml"
  push:
    branches:
      - feature/m2-4-zero-touch-agent-auth
    paths:
      - "mcp_gateway/**"
      - ".github/workflows/m2-4-agent-credential-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-cli-python310-compatibility:
    name: Agent admin CLI compatibility (Python 3.10)
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"

      - name: Compile tokenless Agent admin modules
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m py_compile tools/airbridge_agent_admin.py mcp_gateway/airbridge_mcp_gateway/credential_store.py

      - name: Test tokenless provisioning helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m unittest discover -s mcp_gateway/tests -p test_agent_admin.py -v

  gateway-credential-tests:
    name: Gateway + Windows Credential Manager (Python ${{ matrix.python-version }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Gateway
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -e ./mcp_gateway

      - name: Compile Gateway
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m compileall -q mcp_gateway/airbridge_mcp_gateway

      - name: Run Gateway and Credential Manager tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m unittest discover -s mcp_gateway/tests -v
