name: Runtime Session CI (hosted Windows)

on:
  push:
    branches:
      - feature/runtime-session-p1-2
    paths:
      - "protocol.py"
      - "runtime_session_protocol.py"
      - "airbridge_app.py"
      - "request_tracker.py"
      - "request_broker.py"
      - "runtime_adapter.py"
      - "capture_tcl_bridge.py"
      - "test/test_capture_tcl_bridge.py"
      - "test/test_runtime_adapter.py"
      - "test/test_runtime_session_protocol.py"
      - "test/test_runtime_session_ab_simulation.py"
      - "test/test_request_tracker.py"
      - "test/test_request_broker.py"
      - "test/test_request_api_http.py"
      - ".github/workflows/runtime-session-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-unit:
    name: Protocol unit tests
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run protocol and request-tracker tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          python -m unittest discover -s test -p "test_runtime_session_protocol.py" -v
          python -m unittest discover -s test -p "test_request_tracker.py" -v

      - name: Compile Runtime and Capture Bridge modules
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m py_compile runtime_adapter.py capture_tcl_bridge.py airbridge_app.py

      - name: Run Capture Tcl Bridge tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m unittest discover -s test -p "test_capture_tcl_bridge.py" -v

      - name: Run Runtime Adapter and Profile tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m unittest discover -s test -p "test_runtime_adapter.py" -v

      - name: Run durable request broker tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m unittest discover -s test -p "test_request_broker.py" -v

  ab-duplex-simulation:
    name: A/B duplex handshake simulation
    needs: protocol-unit
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production-module import dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check "PySide6==6.8.3" "pyserial==3.5"

      - name: Run production SerialWorker A/B simulation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m unittest discover -s test -p "test_runtime_session_ab_simulation.py" -v

      - name: Run correlated HTTP API integration tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m unittest discover -s test -p "test_request_api_http.py" -v
